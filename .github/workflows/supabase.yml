name: Supabase

# Applies new files in supabase/migrations to the Supabase project, in order, with the Supabase CLI.
# Needs two repository secrets (docs/deploy.md): SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD.

on:
  push:
    branches: [main, revamp/interactive-legal]
    paths:
      - supabase/migrations/**
      - .github/workflows/supabase.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: dkgxiojcuqtetgxmkniw
    steps:
      - uses: actions/checkout@v4
      - name: Check the secrets are set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD repository secrets (docs/deploy.md), then re-run this job."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase migration list
      - run: supabase db push
      - run: supabase migration list
