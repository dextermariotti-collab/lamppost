name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # bun.lock points at Lovable's private package mirror and package-lock.json is stale,
      # so install from package.json alone (see CLAUDE.md, "Dependencies").
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
